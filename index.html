<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全動画対応 プレイリストセレクター</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #212121;
            --accent-color: #ff0000;
            --accent-hover: #cc0000;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        .input-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background-color: #181818;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-label {
            font-size: 13px;
            color: var(--text-sub);
            white-space: nowrap;
            width: 80px;
            text-align: right;
        }

        input[type="password"],
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #0a0a0a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .playlist-buttons-container {
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 10px;
            text-align: left;
        }

        .playlist-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .playlist-btn {
            padding: 10px 18px;
            background-color: #333333;
            color: #ffffff;
            border: 2px solid #444444;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .playlist-btn:hover {
            background-color: #444444;
            border-color: #666666;
        }

        .playlist-btn.active {
            background-color: var(--accent-color);
            border-color: #ff4444;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000000;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .status-msg {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 12px;
            min-height: 20px;
        }

        .error-msg {
            color: #ff5555;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 14px;
            max-height: 480px;
            overflow-y: auto;
            padding: 12px;
            background-color: #141414;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .video-grid::-webkit-scrollbar {
            width: 8px;
        }

        .video-grid::-webkit-scrollbar-thumb {
            background-color: #444;
            border-radius: 4px;
        }

        .video-card {
            cursor: pointer;
            text-align: left;
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 6px;
            background-color: #1e1e1e;
        }

        .video-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            background-color: #282828;
        }

        .video-card.playing {
            border-color: var(--accent-color);
            background-color: #331111;
        }

        .video-card img {
            width: 100%;
            border-radius: 6px;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .video-card .title {
            font-size: 12px;
            line-height: 1.4;
            margin-top: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #eeeeee;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="header-title">🎬 再生リスト選択プレイヤー</h2>

        <!-- APIキー＆カスタムURL設定 -->
        <div class="input-panel">
            <div class="input-row">
                <span class="input-label">APIキー:</span>
                <input type="password" id="api-key" placeholder="Google Cloudで取得したAPIキーを入力" autocomplete="off">
            </div>
            <div class="input-row">
                <span class="input-label">手入力URL:</span>
                <input type="text" id="custom-url" placeholder="別の再生リストURL / IDを直接入力したい場合">
                <button class="playlist-btn" onclick="loadCustomPlaylist()">取得</button>
            </div>
        </div>

        <!-- 特定再生リストの選択ボタン一覧 -->
        <div class="playlist-buttons-container">
            <div class="section-label">📌 登録済み再生リストから選択:</div>
            <div id="playlist-buttons" class="playlist-grid">
                <!-- JavaScriptでプリセットボタンがここに動的に追加されます -->
            </div>
        </div>

        <!-- 動画プレイヤー -->
        <div class="video-container">
            <iframe id="live-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <!-- 状態メッセージ -->
        <div id="status-msg" class="status-msg">APIキーを入力し、上のリストボタンを選択してください。</div>
        
        <!-- 全動画サムネイルグリッド -->
        <div id="video-grid" class="video-grid"></div>
    </div>

    <script>
        
        // =========================================================================
        // 【設定】よく見る再生リストをここに登録できます。
        // id は再生リストのID（PL...）または チャンネル全動画ID（UU...）を指定してください。
        // =========================================================================
        const PRESET_PLAYLISTS = [
            { name: "まさのふろつぐ", id: "UUrk3BDRC9xzEFMj9cGly6pQ" },
            { name: "BIGサイトウ", id: "UUT3tWrUcsXmpOEF39q0VGnA" },
            { name: "まるり64", id: "UUYKJj4dLZuyS2TqcxFplmbw" }
            // 追加したい場合はカンマ区切りで自由に追加できます:
            // { name: "お気に入りリスト", id: "PLxxxxxxxxxxxxxxxx" }
        ];

        let currentVideoList = [];
        let activeVideoId = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderPresetButtons();
        });

        // プリセットボタンを表示する関数
        function renderPresetButtons() {
            const container = document.getElementById('playlist-buttons');
            container.innerHTML = '';

            PRESET_PLAYLISTS.forEach((pl, index) => {
                const btn = document.createElement('button');
                btn.className = 'playlist-btn';
                btn.textContent = pl.name;
                btn.onclick = () => {
                    // アクティブスタイルの付け替え
                    document.querySelectorAll('.playlist-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    fetchPlaylistVideos(pl.id);
                };
                container.appendChild(btn);
            });
        }

        function loadCustomPlaylist() {
            const input = document.getElementById('custom-url').value.trim();
            if (!input) {
                showStatus('再生リストURLまたはIDを入力してください。', true);
                return;
            }

            const playlistId = extractPlaylistId(input);
            if (!playlistId) {
                showStatus('有効な再生リストURLまたはIDではありません。', true);
                return;
            }

            // プリセットボタンの選択解除
            document.querySelectorAll('.playlist-btn').forEach(b => b.classList.remove('active'));
            fetchPlaylistVideos(playlistId);
        }

        async function fetchPlaylistVideos(playlistId) {
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) {
                showStatus('APIキーを入力してください（伏字入力欄）。', true);
                return;
            }

            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            showStatus('動画一覧を全件取得中...（100件以上の場合は数秒かかります）');

            try {
                // 102件などの大容量動画も全件取得するためページネーションループを実行
                const videos = await fetchAllPages(playlistId, apiKey);
                
                if (videos.length === 0) {
                    showStatus('動画が見つかりませんでした。プライベート動画または削除済みの可能性があります。', true);
                    return;
                }

                currentVideoList = videos;
                showStatus(`全 ${videos.length} 件の動画を取得しました！クリックして再生できます。`);
                renderGrid(videos);
                
                // 1件目の動画を自動セット
                if (videos.length > 0) {
                    const firstVideoId = videos[0].snippet.resourceId.videoId;
                    playVideo(firstVideoId);
                }

            } catch (err) {
                console.error(err);
                showStatus('取得中にエラーが発生しました。APIキーおよびIDをご確認ください。', true);
            }
        }

        async function fetchAllPages(playlistId, apiKey) {
            let allItems = [];
            let nextPageToken = '';

            do {
                // 1回のAPI呼び出しで最大50件取得
                const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=50&pageToken=${nextPageToken}&key=${apiKey}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (data.items) {
                    allItems = allItems.concat(data.items);
                }
                
                // 次のページ（51件目〜）が存在すればトークンが入る
                nextPageToken = data.nextPageToken || '';
            } while (nextPageToken);

            return allItems;
        }

        function extractPlaylistId(input) {
            const match = input.match(/[?&]list=([^&]+)/);
            if (match) return match[1];
            
            if (input.startsWith('UC')) {
                return 'UU' + input.slice(2); // チャンネルIDを全動画再生リストIDに変換
            }
            if (input.startsWith('UU') || input.startsWith('PL')) {
                return input;
            }
            return null;
        }

        function renderGrid(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            videos.forEach(item => {
                const videoId = item.snippet.resourceId.videoId;
                const title = item.snippet.title;
                const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url;

                // 削除済み動画や非公開動画のスキップ
                if (!thumb || title === 'Private video' || title === 'Deleted video') return;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.dataset.id = videoId;
                card.onclick = () => playVideo(videoId);

                card.innerHTML = `
                    <img src="${thumb}" alt="thumbnail" loading="lazy">
                    <div class="title">${escapeHtml(title)}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playVideo(videoId) {
            activeVideoId = videoId;
            const player = document.getElementById('live-player');
            player.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";

            // 再生中の動画カードのスタイルを変更
            document.querySelectorAll('.video-card').forEach(card => {
                if (card.dataset.id === videoId) {
                    card.classList.add('playing');
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    card.classList.remove('playing');
                }
            });
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            if (isError) {
                el.classList.add('error-msg');
            } else {
                el.classList.remove('error-msg');
            }
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
